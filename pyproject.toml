[project]
name = "jaxglitches"
version = "0.1.0"
description = "JAX-based LISA glitch waveforms, TDI responses (equal and unequal arms), and parameter-estimation utilities"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jax>=0.10.0",
    "lisaglitch>=2.0.0",
    "lisaorbits>=3.0.0",
    "numpy>=1.24",
    "wdm-transform[jax]>=0.5.0",
]

[project.optional-dependencies]
notebook = [
    "matplotlib",
    "scipy",
    "ipykernel",
    "jexplore>=0.0.2",   # affine-invariant ensemble sampler (notebooks/*, e.g. glitch_only/orbits_comparison.ipynb §8)
]
# The external LISA simulation chain, used only by the end-to-end validation
# (paper/validation/04_end_to_end.ipynb and §5 of
# notebooks/glitch_only/raw_and_tdi_tests.ipynb). Not a package dependency: it
# pulls in dask/bokeh and nothing in jaxglitches imports it.
simulation = [
    "lisainstrument>=2.3.0",
    "pytdi>=2.2.0",
]
# CUDA-enabled jaxlib. Nothing in the package needs changing to run on GPU --
# these extras only pull the plugin that lets JAX see the device. Linux/x86_64
# only, which is where NVIDIA publishes the wheels.
#   gpu        -> CUDA 12 build, needs NVIDIA driver >= 525 (widest compatibility)
#   gpu-cuda13 -> CUDA 13 build, needs NVIDIA driver >= 580
# Pick the one matching `nvidia-smi`; installing the wrong one silently falls
# back to CPU. Benchmarks in paper/validation were taken with gpu-cuda13.
gpu = [
    "jax[cuda12]>=0.10.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
gpu-cuda13 = [
    "jax[cuda13]>=0.10.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# src layout; the bundled LPF catalogue (lpf_data/*.txt) ships with the wheel
packages = ["src/jaxglitches"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
